name: release

# v로 시작하는 태그를 밀면 윈도우 러너가 빌드해서 GitHub Releases에 올린다.
# 로컬에서 npm run release를 돌릴 필요가 없다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 태그와 package.json 버전이 어긋나면 여기서 멈춘다.
      # electron-builder는 태그가 아니라 package.json 버전으로 릴리즈를 만들기 때문에,
      # 둘이 다르면 엉뚱한 버전이 올라가고 자동 업데이트가 꼬인다.
      - name: 태그와 package.json 버전 대조
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::태그 v$tag 와 package.json $pkg 가 다릅니다. 버전을 맞추고 태그를 다시 미세요."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: 빌드 및 게시
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
